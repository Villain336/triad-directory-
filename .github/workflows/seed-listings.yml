name: Seed Listings from Google Places

on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 1 * *'

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/triad-services-directory-HaDtI

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Verify API key exists
        run: |
          if [ -z "$GOOGLE_PLACES_API_KEY" ]; then
            echo "ERROR: GOOGLE_PLACES_API_KEY secret is not set"
            echo "Go to repo Settings → Secrets → Actions → New repository secret"
            exit 1
          fi
          echo "API key is set (length: ${#GOOGLE_PLACES_API_KEY})"
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}

      - name: Run seed script
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: npx tsx src/scripts/seed-from-google.ts
