name: Seed Listings from Google Places

on:
  # Run manually from GitHub Actions tab
  workflow_dispatch:
  # Or run monthly on the 1st at 6am EST
  schedule:
    - cron: '0 11 1 * *'

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/triad-services-directory-HaDtI

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Run seed script
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: npx tsx src/scripts/seed-from-google.ts
